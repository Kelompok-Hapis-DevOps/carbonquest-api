# SonarQube / SonarCloud Project Configuration

sonar.projectKey=carbonquest-api
sonar.projectName=CarbonQuest API
sonar.organization=kelompok-hapis-devops
sonar.projectVersion=1.0.0

# Path ke source code dan test suite
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Integrasi Code Coverage dari Jest (lcov format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File exclusions
sonar.exclusions=dist/**,node_modules/**,coverage/**,src/config/swagger.ts,prisma/**,src/middleware/upload.middleware.ts
sonar.coverage.exclusions=src/routes/**,src/repositories/**,src/server.ts,src/app.ts,src/prisma/**,src/middleware/upload.middleware.ts,src/config/swagger.ts
sonar.test.inclusions=tests/**/*.test.ts

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.json
